[input.keyboard]
numlock_toggle = true

[input.mouse]
natural_scroll = false
accel_profile = "flat"
sensitivity = 0.0
scroll_wheel_step = 60
# scroll_button = "MouseBack"
# scroll_button_lock = false

[input.touchpad]
tap = true
natural_scroll = true
# accel_profile = "adaptive"
# sensitivity = 0.5
scroll_factor = 0.5
disable_while_typing = true
# click_method = "clickfinger"
# tap_button_map = "left_middle_right"

[input.focus]
follows_mouse = true

