[input.keyboard]
numlock_toggle = true

[input.mouse]
natural_scroll = false
accel_profile = "flat"
sensitivity = 0.0
scroll_wheel_step = 60

[input.touchpad]
tap = true
natural_scroll = true
scroll_factor = 0.5
disable_while_typing = true

[input.cursor]
theme = "capitaine-cursors-light"
size = 32
hardware_cursor = true

[input.focus]
follows_mouse = true

