[animation]
enabled = true
duration_ms = 250
curve = "supersilk"

# --- Named curves ---------------------------------------------------------

[animation.beziers]
supersilk = [0.22, 1.0, 0.36, 1.0]
softbounce = [0.34, 1.56, 0.64, 1.0]
linear = [0.0, 0.0, 1.0, 1.0]

# --- Windows --------------------------------------------------------------

[animation.windows_in]
enabled = true
curve = "softbounce"
duration_ms = 600
style = "popin"
scale = 0.92

[animation.windows_out]
enabled = true
curve = "supersilk"
duration_ms = 300
style = "popin"
scale = 0.9

[animation.windows_move]
enabled = true
curve = "spring:1,300"

[animation.windows_resize]
enabled = true
curve = "spring:1,300"

[animation.workspaces]
enabled = true
style = "slide"
curve = "supersilk"
duration_ms = 800

[animation.overview]
enabled = true
curve = "spring:1,500"
workspace_curve = "spring:1,400"

[animation.scratchpad]
enabled = true
curve = "spring:0.9,400"
dim = 0.3
blur = true

[animation.dialogs]
enabled = true
dim = 0.3

[animation.border]
enabled = true
curve = "linear"
duration_ms = 500

[animation.layers]
enabled = false

